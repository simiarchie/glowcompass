<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GlowCompass — Your Indian Beauty Intelligence Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --cream: #FAF6F1;
            --terracotta: #C4714A;
            --sage: #7A9E8A;
            --warm-brown: #4A3728;
            --blush: #F2DDD3;
            --gold: #C9A96E;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--cream);
            color: var(--warm-brown);
            line-height: 1.6;
            overflow-x: hidden;
        }

        h1, h2, h3, h4 {
            font-family: 'Playfair Display', serif;
            font-weight: 600;
        }

        /* Navigation */
        nav {
            position: sticky;
            top: 0;
            background: rgba(250, 246, 241, 0.95);
            backdrop-filter: blur(10px);
            padding: 1.2rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            border-bottom: 1px solid rgba(196, 113, 74, 0.1);
            animation: slideDown 0.6s ease;
        }

        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--warm-brown);
        }

        .logo em {
            color: var(--terracotta);
            font-style: italic;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            list-style: none;
            align-items: center;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--warm-brown);
            font-weight: 500;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: var(--terracotta);
        }

        .cta-pill {
            background: linear-gradient(135deg, var(--terracotta), var(--gold));
            color: white;
            padding: 0.7rem 1.8rem;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            transition: transform 0.3s, box-shadow 0.3s;
            box-shadow: 0 4px 15px rgba(196, 113, 74, 0.2);
        }

        .cta-pill:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(196, 113, 74, 0.3);
        }

        /* Hero Section */
        .hero {
            padding: 5rem 5% 4rem;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4rem;
            align-items: center;
            animation: fadeIn 1s ease;
        }
